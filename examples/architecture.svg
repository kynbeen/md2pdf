  <text x="400" y="206" font-family="'Pretendard', sans-serif" font-size="13" fill="#5f6368" text-anchor="middle">&lt;base href&gt; 로컬 자산</text>

  <!-- Arrow 2 -->
  <path d="M 505 160 L 565 160" stroke="#5f6368" stroke-width="2"/>

  <!-- Step 3: Chromium PDF -->
  <rect x="570" y="90" width="180" height="140" rx="8" fill="#111418" stroke="#111418" stroke-width="1.5"/>
  <text x="660" y="140" font-family="'Pretendard', sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Publication PDF</text>
  <text x="660" y="170" font-family="'Pretendard', sans-serif" font-size="13" fill="#d5d9de" text-anchor="middle">Playwright Chromium</text>
