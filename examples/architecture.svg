<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320">
  <rect width="100%" height="100%" fill="#f8f9fa" rx="12" stroke="#d5d9de" stroke-width="1.5"/>
  
  <!-- Step 1: Markdown -->
