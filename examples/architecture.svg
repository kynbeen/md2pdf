  <text x="140" y="170" font-family="'Pretendard', sans-serif" font-size="13" fill="#5f6368" text-anchor="middle">들여쓰기·블록 정규화</text>
  <text x="140" y="192" font-family="'Pretendard', sans-serif" font-size="13" fill="#5f6368" text-anchor="middle">preprocess.py</text>

  <!-- Arrow 1 -->
