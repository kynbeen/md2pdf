  <rect x="300" y="90" width="200" height="140" rx="8" fill="#ffffff" stroke="#202124" stroke-width="1.5"/>
  <text x="400" y="132" font-family="'Pretendard', sans-serif" font-size="18" font-weight="bold" fill="#111418" text-anchor="middle">2. Typora-Style HTML</text>
  <text x="400" y="162" font-family="'Pretendard', sans-serif" font-size="13" fill="#5f6368" text-anchor="middle">Pretendard + Open Sans</text>
